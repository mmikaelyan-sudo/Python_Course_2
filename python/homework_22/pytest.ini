[pytest]
pythonpath = .
testpaths = tests

addopts =
    -v
    -ra
    --strict-markers
    --html=artefacts/report.html
    --self-contained-html

markers =
    config: tests that validate the device config
    data_processing: tests for the convert_to_upper function
    negative: tests with invalid input

log_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file = artefacts/pytest.log.txt
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
